<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astelle · 待办页 v5 预览（可交互）</title>
<style>
  :root{
    --paper:#F6F1E8; --card:#FFFCF7; --ink:#2B2620; --ink-soft:#6B6258;
    --muted:#A29789; --accent:#B85C38; --accent-mist:#F3E2D8; --danger:#A33B2E;
    --danger-mist:#F5E4DF;
    --divider:rgba(43,38,32,.12);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#EDE7DC;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .frame{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;
         box-shadow:0 0 60px rgba(43,38,32,.10);padding-bottom:130px;position:relative}

  /* ── 顶栏（同设置页语言） ── */
  .topbar{display:flex;align-items:center;gap:10px;padding:18px 16px 0;position:relative}
  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);
            border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;flex:none}
  .icon-btn svg{width:18px;height:18px}
  .spacer{flex:1}
  h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.02em;padding:6px 20px 2px}
  .note{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:8px 22px 2px;line-height:1.9}

  /* ── 筛选 chips（同侧栏筛选语言） ── */
  .chips{display:flex;gap:9px;padding:16px 20px 4px}
  .fchip{font-size:11.5px;letter-spacing:.12em;color:var(--ink-soft);border:1px solid var(--divider);
         border-radius:999px;padding:6px 13px}
  .fchip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-mist)}
  .fchip .n{font-family:var(--serif);margin-left:5px;opacity:.8}

  /* ── 待办项 ── */
  .todo{margin:12px 14px 8px;background:var(--card);border:1px solid var(--divider);
        border-radius:14px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start}
  .todo.over{background:var(--danger-mist);border-color:rgba(163,59,46,.25)}
  .c\boxed{width:22px;height:22px;flex:none;margin-top:1px;position:relative}
  .cbox svg{width:22px;height:22px;display:block}
  .cbox.sm{width:17px;height:17px}
  .cbox.sm svg{width:17px;height:17px}
  .t-body{flex:1}
  .t-title{font-family:var(--serif);font-size:16.5px;line-height:1.5}
  .t-meta{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.05em;
          display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--divider);border-radius:999px;padding:2.5px 9px;letter-spacing:.1em}
  .chip.due{color:var(--danger);border-color:rgba(163,59,46,.35)}
  .chip.today{color:var(--accent);border-color:rgba(184,92,56,.35);background:var(--accent-mist)}
  .t-right{font-family:var(--serif);font-size:15px;color:var(--accent);white-space:nowrap;padding-top:2px}
  .t-right.over{color:var(--danger)}
  .t-right small{font-family:var(--sans);font-size:10px;color:var(--muted);letter-spacing:.15em}

  /* ── 子项（树形） ── */
  .sub{margin:0 14px 8px 34px;padding:9px 14px;display:flex;gap:12px;align-items:center;position:relative}
  .sub::before{content:"";position:absolute;left:-9px;top:-9px;bottom:50%;width:1.5px;background:var(--divider)}
  .sub.last::before{bottom:calc(50% + 2px)}
  .sub .t-title{font-size:14.5px}
  .sub .t-right{font-size:13px}

  /* ── 已完成折叠 ── */
  .fold{margin:12px 14px 4px;border:1px dashed var(--divider);border-radius:12px;
        padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.12em}
  .fold .arrow{margin-left:auto;font-size:11px}
  .fold .strike{color:var(--muted);text-decoration:line-through;font-family:var(--serif);letter-spacing:0}

  /* ── 历时：头条巨型卡 ── */
  .hero{margin:14px 14px 10px;background:var(--card);border:1px solid var(--divider);
        border-radius:18px;padding:20px;display:flex;align-items:center;gap:16px}
  .hero .h-left{flex:1}
  .hero .pin{width:14px;height:14px;opacity:.5;margin-bottom:6px}
  .hero .h-title{font-family:var(--serif);font-size:19px}
  .hero .h-meta{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.05em;line-height:1.8}
  .hero .anniv{font-size:10.5px;color:var(--accent);letter-spacing:.08em;margin-top:2px}
  .hero .h-num{font-family:var(--serif);font-size:64px;line-height:.95;letter-spacing:-.03em;color:var(--ink-soft)}
  .hero .h-unit{font-size:10px;letter-spacing:.25em;color:var(--muted);text-align:right;margin-top:8px}

  /* ── 历时：普通行 ── */
  .timer-row{margin:0 14px 8px;background:var(--card);border:1px solid var(--divider);
             border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:13px}
  .tm-body{flex:1}
  .tm-title{font-family:var(--serif);font-size:16.5px}
  .tm-meta{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.05em}
  .tm-right{text-align:right;min-width:86px}
  .tm-right .num{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.02em;color:var(--ink-soft)}
  .tm-right .unit{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:5px}

  /* ── 底部双件套（同首页工具栏语法：胶囊居中 + 加号球钉右） ── */
  .pill{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
        width:236px;height:46px;border-radius:999px;background:var(--card);
        border:1px solid var(--divider);padding:4px;display:flex;z-index:9;
        box-shadow:0 6px 22px rgba(43,38,32,.08)}
  .pill .thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);
        background:var(--accent-mist);border-radius:999px;transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .pill.right .thumb{transform:translateX(100%)}
  .pill button{flex:1;background:none;border:none;font-family:var(--sans);font-size:13.5px;
        letter-spacing:.12em;color:var(--muted);z-index:1;cursor:pointer;display:flex;
        align-items:center;justify-content:center;gap:7px}
  .pill button.active{color:var(--accent);font-weight:600}
  .pill .n{font-family:var(--serif);font-size:12px;letter-spacing:0;opacity:.85}

  .ball{position:fixed;right:22px;bottom:23px;width:48px;height:48px;border-radius:50%;
        background:var(--card);border:1px solid var(--divider);z-index:10;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 22px rgba(43,38,32,.08)}
  .ball svg{width:20px;height:20px}
  .ball:active{background:var(--accent-mist)}

  /* 面板切换 */
  .pane{display:none;animation:fade .25s ease}
  .pane.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="frame">

  <!-- ═══════ 顶栏 ═══════ -->
  <div class="topbar">
    <div class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2B2620" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </div>
    <div class="spacer"></div>
  </div>

  <h1 id="pageTitle">待办</h1>
  <div class="note">底部＝首页工具栏语法：胶囊居中切换两区 + 加号球钉右下（随当前区直接新建，无菜单）</div>

  <!-- ═══════ 待办面板 ═══════ -->
  <div class="pane show" id="pane-todo">
    <div class="chips">
      <div class="fchip on">全部 <span class="n">3</span></div>
      <div class="fchip">今天 <span class="n">1</span></div>
      <div class="fchip">已过期 <span class="n">1</span></div>
    </div>

    <!-- 逾期：整卡状态色洗 -->
    <div class="todo over">
      <div class="cbox">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#A33B2E" stroke-width="1.6"/></svg>
      </div>
      <div class="t-body">
        <div class="t-title">交设计稿</div>
        <div class="t-meta"><span class="chip due">已过期 · 10-14</span></div>
      </div>
      <div class="t-right over">2 <small>天</small></div>
    </div>

    <!-- 母项：勾选圈 = 进度环（2/3） -->
    <div class="todo">
      <div class="cbox">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="rgba(43,38,32,.18)" stroke-width="2.4"/>
          <circle cx="12" cy="12" r="10" fill="none" stroke="#B85C38" stroke-width="2.4"
                  stroke-linecap="round" stroke-dasharray="41.5 62.8" transform="rotate(-90 12 12)"/>
        </svg>
      </div>
      <div class="t-body">
        <div class="t-title">冰岛行程准备</div>
        <div class="t-meta"><span class="chip due">截止 11-02</span><span>2 / 3 已完成</span></div>
      </div>
      <div class="t-right">23 <small>天</small></div>
    </div>
    <div class="sub">
      <div class="cbox sm">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#B85C38"/><path d="M8 12.5l2.6 2.6L16 9.5" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="t-body"><div class="t-title">办签证</div></div>
      <div class="t-right" style="color:var(--muted)"><small>完成</small></div>
    </div>
    <div class="sub">
      <div class="cbox sm">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#B85C38"/><path d="M8 12.5l2.6 2.6L16 9.5" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="t-body"><div class="t-title">订机票</div></div>
      <div class="t-right" style="color:var(--muted)"><small>完成</small></div>
    </div>
    <div class="sub last">
      <div class="cbox sm">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#6B6258" stroke-width="1.5"/></svg>
      </div>
      <div class="t-body"><div class="t-title">买羽绒服</div></div>
      <div class="t-right">23 <small>天</small></div>
    </div>

    <!-- 今天到期 -->
    <div class="todo">
      <div class="cbox">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#6B6258" stroke-width="1.6"/></svg>
      </div>
      <div class="t-body">
        <div class="t-title">给车做保养</div>
        <div class="t-meta"><span class="chip today">今天到期</span></div>
      </div>
      <div class="t-right">今 天</div>
    </div>

    <div class="fold">
      <div class="cbox sm">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#B85C38"/><path d="M8 12.5l2.6 2.6L16 9.5" fill="none" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span>已完成 · 1</span>
      <span class="strike">取快递</span>
      <div class="arrow">▾</div>
    </div>
  </div>

  <!-- ═══════ 历时面板 ═══════ -->
  <div class="pane" id="pane-timer">
    <!-- 头条巨型卡（置顶项） -->
    <div class="hero">
      <div class="h-left">
        <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="#2B2620" stroke-width="1.6" stroke-linecap="round">
          <path d="M9 4h6M12 4v7M7 11h10l-1.5 8h-7z"/>
        </svg>
        <div class="h-title">在一起</div>
        <div class="h-meta">起始 2023-08-14 · 那天的晚霞很好看</div>
        <div class="anniv">距下个周年 · 77 天</div>
      </div>
      <div>
        <div class="h-num">1153</div>
        <div class="h-unit">天</div>
      </div>
    </div>

    <div class="timer-row">
      <div class="tm-body">
        <div class="tm-title">毕业</div>
        <div class="tm-meta">起始 2022-06-28</div>
      </div>
      <div class="tm-right">
        <div class="num">1565</div>
        <div class="unit">天</div>
      </div>
    </div>

    <div class="timer-row">
      <div class="tm-body">
        <div class="tm-title">开了这台车</div>
        <div class="tm-meta">起始 2021-03-09</div>
      </div>
      <div class="tm-right">
        <div class="num">2042</div>
        <div class="unit">天</div>
      </div>
    </div>
  </div>

  <!-- ═══════ 底部双件套：胶囊居中 + 加号球钉右（同首页工具栏语法） ═══════ -->
  <div class="pill" id="pill">
    <div class="thumb"></div>
    <button class="active" onclick="switchPane('todo')">待办 <span class="n">3</span></button>
    <button onclick="switchPane('timer')">历时 <span class="n">3</span></button>
  </div>
  <div class="ball" id="ball" title="新建待办">
    <svg viewBox="0 0 24 24" fill="none" stroke="#B85C38" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 6v12M6 12h12"/>
    </svg>
  </div>
</div>

<script>
  function switchPane(which) {
    const pill = document.getElementById('pill');
    const btns = pill.querySelectorAll('button');
    document.getElementById('pane-todo').classList.toggle('show', which === 'todo');
    document.getElementById('pane-timer').classList.toggle('show', which === 'timer');
    document.getElementById('pageTitle').textContent = which === 'todo' ? '待办' : '历时';
    btns[0].classList.toggle('active', which === 'todo');
    btns[1].classList.toggle('active', which === 'timer');
    pill.classList.toggle('right', which === 'timer');
    document.getElementById('ball').title = which === 'todo' ? '新建待办' : '新建历时';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
