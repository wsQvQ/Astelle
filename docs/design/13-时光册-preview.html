<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astelle · 待办页 v2 预览</title>
<style>
  :root{
    --paper:#F6F1E8; --card:#FFFCF7; --ink:#2B2620; --ink-soft:#6B6258;
    --muted:#A29789; --accent:#B85C38; --accent-mist:#F3E2D8; --danger:#A33B2E;
    --divider:rgba(43,38,32,.12);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#EDE7DC;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .frame{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;
         box-shadow:0 0 60px rgba(43,38,32,.10);padding-bottom:40px}

  /* ── 页头 ── */
  .head{padding:30px 22px 8px;display:flex;align-items:flex-end;justify-content:space-between}
  .head h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.02em}
  .head .today{font-size:11px;letter-spacing:.22em;color:var(--muted);padding-bottom:6px}

  /* ── 分区标题 ── */
  .sec{display:flex;align-items:center;gap:10px;padding:22px 22px 12px}
  .sec .name{font-size:12px;letter-spacing:.35em;color:var(--accent)}
  .sec.timer .name{color:var(--ink-soft)}
  .sec .count{font-size:10px;letter-spacing:.15em;color:var(--muted);
              border:1px solid var(--divider);border-radius:999px;padding:3px 9px}
  .sec .line{flex:1;height:1px;background:var(--divider)}

  /* ── 待办项 ── */
  .todo{margin:0 14px 8px;background:var(--card);border:1px solid var(--divider);
        border-radius:14px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start}
  .cbox{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink-soft);
        flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
  .cbox.sm{width:17px;height:17px;border-width:1.4px}
  .cbox.done{background:var(--accent);border-color:var(--accent)}
  .cbox.done::after{content:"";width:9px;height:5px;border-left:2px solid var(--card);
        border-bottom:2px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
  .t-body{flex:1}
  .t-title{font-family:var(--serif);font-size:16.5px;line-height:1.5}
  .t-meta{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.05em;
          display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--divider);border-radius:999px;padding:2.5px 9px;letter-spacing:.1em}
  .chip.due{color:var(--danger);border-color:rgba(163,59,46,.35)}
  .t-right{font-family:var(--serif);font-size:15px;color:var(--accent);white-space:nowrap;padding-top:2px}
  .t-right.over{color:var(--danger)}
  .t-right small{font-family:var(--sans);font-size:10px;color:var(--muted);letter-spacing:.15em}

  /* ── 子项（树形） ── */
  .sub{margin:0 14px 8px 34px;background:transparent;border:none;border-radius:12px;
       padding:9px 14px;display:flex;gap:12px;align-items:center;position:relative}
  .sub::before{content:"";position:absolute;left:-9px;top:-9px;bottom:50%;width:1.5px;background:var(--divider)}
  .sub.last::before{bottom:calc(50% + 2px);border-radius:2px}
  .sub .t-title{font-size:14.5px}
  .sub .t-right{font-size:13px}

  /* ── 已完成折叠 ── */
  .fold{margin:12px 14px 4px;border:1px dashed var(--divider);border-radius:12px;
        padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.12em}
  .fold .arrow{margin-left:auto;font-size:11px}
  .fold .strike{color:var(--muted);text-decoration:line-through;font-family:var(--serif);letter-spacing:0}

  /* ── 计时项 ── */
  .timer-row{margin:0 14px 8px;background:var(--card);border:1px solid var(--divider);
             border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:13px}
  .tm-body{flex:1}
  .tm-title{font-family:var(--serif);font-size:16.5px}
  .tm-meta{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.05em}
  .tm-right{text-align:right;min-width:86px}
  .tm-right .num{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.02em;color:var(--ink-soft)}
  .tm-right .unit{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:5px}

  /* ── 新建入口 ── */
  .add{margin:18px 14px 0;border:1.5px dashed var(--divider);border-radius:14px;
       padding:14px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.25em}

  .foot{font-size:11px;color:var(--muted);letter-spacing:.25em;text-align:center;padding:38px 0 8px}
</style>
</head>
<body>
<div class="frame">

  <div class="head">
    <h1>待办</h1>
    <div class="today">今天 · 2026-10-11</div>
  </div>

  <!-- ═══════ 待办区 ═══════ -->
  <div class="sec">
    <div class="name">待 办</div><div class="count">3</div><div class="line"></div>
  </div>

  <div class="todo">
    <div class="cbox"></div>
    <div class="t-body">
      <div class="t-title">冰岛行程准备</div>
      <div class="t-meta"><span class="chip due">截止 11-02</span><span>2 / 3 已完成</span></div>
    </div>
    <div class="t-right">23 <small>天</small></div>
  </div>
  <div class="sub">
    <div class="cbox sm done"></div>
    <div class="t-body"><div class="t-title">办签证</div></div>
    <div class="t-right" style="color:var(--muted)"><small>完成</small></div>
  </div>
  <div class="sub">
    <div class="cbox sm done"></div>
    <div class="t-body"><div class="t-title">订机票</div></div>
    <div class="t-right" style="color:var(--muted)"><small>完成</small></div>
  </div>
  <div class="sub last">
    <div class="cbox sm"></div>
    <div class="t-body"><div class="t-title">买羽绒服</div></div>
    <div class="t-right">23 <small>天</small></div>
  </div>

  <div class="todo">
    <div class="cbox"></div>
    <div class="t-body">
      <div class="t-title">交设计稿</div>
      <div class="t-meta"><span class="chip due">截止 10-14</span></div>
    </div>
    <div class="t-right over">3 <small>天</small></div>
  </div>

  <div class="todo">
    <div class="cbox"></div>
    <div class="t-body">
      <div class="t-title">给车做保养</div>
      <div class="t-meta"><span class="chip">无截止</span></div>
    </div>
    <div class="t-right" style="color:var(--muted)">—</div>
  </div>

  <div class="fold">
    <div class="cbox sm done"></div>
    <span>已完成 · 1</span>
    <span class="strike">取快递</span>
    <div class="arrow">▾</div>
  </div>

  <div class="add">＋ 新 建 待 办</div>

  <!-- ═══════ 计时区 ═══════ -->
  <div class="sec timer">
    <div class="name">计 时</div><div class="count">2</div><div class="line"></div>
  </div>

  <div class="timer-row">
    <div class="tm-body">
      <div class="tm-title">在一起</div>
      <div class="tm-meta">起始 2023-08-14 · 那天的晚霞很好看</div>
    </div>
    <div class="tm-right">
      <div class="num">1153</div>
      <div class="unit">天</div>
    </div>
  </div>

  <div class="timer-row">
    <div class="tm-body">
      <div class="tm-title">毕业</div>
      <div class="tm-meta">起始 2022-06-28</div>
    </div>
    <div class="tm-right">
      <div class="num">1565</div>
      <div class="unit">天</div>
    </div>
  </div>

  <div class="add">＋ 新 建 计 时</div>

  <div class="foot">ASTELLE · 待办 · 计时</div>
</div>
</body>
</html>
