<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#B8A992" stroke-width="1"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2C2418" flood-opacity="0.06"/>
    </filter>
    <style>
      .t-title{font-size:14px;font-weight:500;fill:#2C2418;}
      .t-cap{font-size:11px;fill:#9C8B74;}
      .t-h{font-size:13px;font-weight:500;fill:#2C2418;}
      .t-n{font-size:11px;fill:#9C8B74;}
      .t-acc{font-size:11px;font-weight:500;fill:#D4843A;}
      .t-ink{font-size:13px;fill:#2C2418;}
      .t-cell{font-size:10px;fill:#4A4034;}
      .t-mood{font-size:13px;}
      .t-day{font-size:11px;fill:#4A4034;}
    </style>
  </defs>

  <text x="36" y="34" class="t-title">日记页 · 两态</text>
  <text x="36" y="54" class="t-cap">地图态 / 书写态</text>

  <!-- ================= 地图态 ================= -->
  <rect x="36" y="80" width="300" height="500" rx="22" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>

  <!-- header -->
  <g>
    <path d="M62 112 L54 118 L62 124" fill="none" stroke="#9C8B74" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="122" class="t-h">日记</text>
    <text x="312" y="122" class="t-n" text-anchor="end">2026</text>
  </g>

  <!-- year ribbon -->
  <g>
    <rect x="56" y="140" width="268" height="8" rx="4" fill="#F3EBE0"/>
    <rect x="56" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.88"/>
    <rect x="82" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.55"/>
    <rect x="108" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.72"/>
    <rect x="134" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.92"/>
    <rect x="160" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.40"/>
    <rect x="186" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.62"/>
    <rect x="212" y="140" width="22" height="8" rx="4" fill="#D4843A" fill-opacity="0.78"/>
  </g>

  <!-- month nav -->
  <g>
    <text x="186" y="182" class="t-h" text-anchor="middle">四月</text>
    <path d="M128 176 L122 181 L128 186" fill="none" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M244 176 L250 181 L244 186" fill="none" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- weekday -->
  <g class="t-n" text-anchor="middle" font-size="10">
    <text x="82" y="206">一</text>
    <text x="118" y="206">二</text>
    <text x="154" y="206">三</text>
    <text x="190" y="206">四</text>
    <text x="226" y="206">五</text>
    <text x="262" y="206">六</text>
    <text x="298" y="206">日</text>
  </g>

  <!-- calendar -->
  <g>
    <!-- r0 -->
    <rect x="68" y="218" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.45"/>
    <rect x="104" y="218" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.45"/>
    <rect x="140" y="218" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="154" y="236" class="t-day" text-anchor="middle">1</text>
    <rect x="176" y="218" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="190" y="236" class="t-mood" text-anchor="middle">🙂</text>
    <rect x="212" y="218" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="226" y="236" class="t-day" text-anchor="middle">3</text>
    <rect x="248" y="218" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="262" y="236" class="t-mood" text-anchor="middle">😊</text>
    <rect x="284" y="218" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.45"/>

    <!-- r1 -->
    <rect x="68" y="254" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="82" y="272" class="t-mood" text-anchor="middle">😐</text>
    <rect x="104" y="254" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="118" y="272" class="t-day" text-anchor="middle">7</text>
    <rect x="140" y="254" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="154" y="272" class="t-mood" text-anchor="middle">😊</text>
    <rect x="176" y="254" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="190" y="272" class="t-mood" text-anchor="middle">🙂</text>
    <rect x="212" y="254" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="226" y="272" class="t-day" text-anchor="middle">10</text>
    <rect x="248" y="254" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.45"/>
    <rect x="284" y="254" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="298" y="272" class="t-mood" text-anchor="middle">😢</text>

    <!-- r2 -->
    <rect x="68" y="290" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="82" y="308" class="t-day" text-anchor="middle">13</text>
    <rect x="104" y="290" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="118" y="308" class="t-mood" text-anchor="middle">😊</text>
    <!-- today -->
    <rect x="140" y="290" width="28" height="28" rx="9" fill="#FAF5EF" stroke="#D4843A" stroke-width="1.5"/>
    <text x="154" y="308" class="t-acc" text-anchor="middle">15</text>
    <rect x="176" y="290" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="190" y="308" class="t-day" text-anchor="middle">16</text>
    <rect x="212" y="290" width="28" height="28" rx="9" fill="#F7E8D4"/>
    <text x="226" y="308" class="t-mood" text-anchor="middle">😠</text>
    <rect x="248" y="290" width="28" height="28" rx="9" fill="#F3EBE0"/>
    <text x="262" y="308" class="t-day" text-anchor="middle">18</text>
    <rect x="284" y="290" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.45"/>

    <!-- r3 future -->
    <rect x="68" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="104" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="140" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="176" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="212" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="248" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
    <rect x="284" y="326" width="28" height="28" rx="9" fill="#F3EBE0" fill-opacity="0.35"/>
  </g>

  <!-- month mood strip -->
  <g>
    <text x="56" y="382" class="t-n">这个月</text>
    <text x="312" y="382" class="t-n" text-anchor="end">12 篇</text>
    <rect x="56" y="394" width="268" height="36" rx="12" fill="#F3EBE0" fill-opacity="0.55"/>
    <text x="76" y="417" class="t-mood">😊</text>
    <text x="102" y="417" class="t-mood">🙂</text>
    <text x="128" y="417" class="t-mood">😐</text>
    <text x="154" y="417" class="t-mood">😊</text>
    <text x="180" y="417" class="t-mood">😠</text>
    <text x="206" y="417" class="t-mood">🙂</text>
    <text x="232" y="417" class="t-mood">😢</text>
    <text x="258" y="417" class="t-mood">😊</text>
    <text x="292" y="417" class="t-n">…</text>
  </g>

  <!-- quiet stats -->
  <text x="186" y="456" class="t-n" text-anchor="middle">连续 5 天</text>

  <!-- CTA -->
  <rect x="56" y="478" width="268" height="42" rx="14" fill="#FAF5EF" stroke="#D4843A" stroke-width="1.25"/>
  <text x="190" y="504" class="t-acc" text-anchor="middle">写今天</text>

  <text x="186" y="556" class="t-cap" text-anchor="middle">态 1 · 地图</text>

  <!-- arrow -->
  <line x1="350" y1="320" x2="394" y2="320" stroke="#B8A992" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ================= 书写态 ================= -->
  <rect x="404" y="80" width="300" height="500" rx="22" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>

  <!-- header -->
  <g>
    <path d="M430 112 L422 118 L430 124" fill="none" stroke="#9C8B74" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="554" y="122" class="t-h" text-anchor="middle">4月15日 · 周三</text>
  </g>

  <!-- save chip -->
  <rect x="620" y="108" width="64" height="26" rx="8" fill="#F7E8D4"/>
  <text x="652" y="125" class="t-acc" text-anchor="middle">已保存</text>

  <!-- mood chips -->
  <g>
    <rect x="424" y="152" width="46" height="46" rx="14" fill="#F7E8D4" stroke="#D4843A" stroke-width="1.4"/>
    <text x="447" y="181" class="t-mood" text-anchor="middle">😊</text>
    <rect x="478" y="152" width="46" height="46" rx="14" fill="#F3EBE0" fill-opacity="0.7"/>
    <text x="501" y="181" class="t-mood" text-anchor="middle">🙂</text>
    <rect x="532" y="152" width="46" height="46" rx="14" fill="#F3EBE0" fill-opacity="0.7"/>
    <text x="555" y="181" class="t-mood" text-anchor="middle">😐</text>
    <rect x="586" y="152" width="46" height="46" rx="14" fill="#F3EBE0" fill-opacity="0.7"/>
    <text x="609" y="181" class="t-mood" text-anchor="middle">😢</text>
    <rect x="640" y="152" width="46" height="46" rx="14" fill="#F3EBE0" fill-opacity="0.7"/>
    <text x="663" y="181" class="t-mood" text-anchor="middle">😠</text>
  </g>

  <!-- divider -->
  <line x1="424" y1="222" x2="684" y2="222" stroke="#E8DDD0"/>

  <!-- body -->
  <g class="t-ink">
    <text x="424" y="258">下午把设计稿又改了一遍，</text>
    <text x="424" y="286">比想象中顺。晚上煮了面，</text>
    <text x="424" y="314">把阳台的灯换成了暖光。</text>
  </g>

  <!-- soft continuation lines (page air) -->
  <rect x="424" y="344" width="220" height="6" rx="3" fill="#F3EBE0" opacity="0.5"/>
  <rect x="424" y="360" width="148" height="6" rx="3" fill="#F3EBE0" opacity="0.35"/>

  <!-- footer meta -->
  <line x1="424" y1="500" x2="684" y2="500" stroke="#E8DDD0"/>
  <text x="424" y="524" class="t-n">128 字</text>
  <text x="684" y="524" class="t-n" text-anchor="end">4月15日</text>

  <text x="554" y="556" class="t-cap" text-anchor="middle">态 2 · 书写</text>
</svg>
