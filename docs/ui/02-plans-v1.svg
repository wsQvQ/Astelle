<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2C2418" flood-opacity="0.06"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#B8A992" stroke-width="1"/>
    </marker>
    <style>
      .t-title{font-size:14px;font-weight:500;fill:#2C2418;}
      .t-cap{font-size:11px;fill:#9C8B74;}
      .t-h{font-size:12px;font-weight:500;fill:#2C2418;}
      .t-n{font-size:10px;fill:#9C8B74;}
      .t-acc{font-size:10px;font-weight:500;fill:#D4843A;}
      .t-ink{font-size:12px;fill:#2C2418;}
      .t-ttl{font-size:11px;font-weight:600;fill:#2C2418;}
      .t-body{font-size:9.5px;fill:#4A4034;}
      .t-date{font-size:8.5px;fill:#B8A992;}
      .t-meta{font-size:8.5px;fill:#B8A992;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
      .t-sec{font-size:9px;font-weight:500;fill:#9C8B74;letter-spacing:0.5;}
      .t-big{font-size:28px;font-weight:600;fill:#D4843A;}
      .t-big-m{font-size:22px;font-weight:600;fill:#9C8B74;}
    </style>
  </defs>

  <text x="36" y="32" class="t-title">计划页 · 三态</text>
  <text x="36" y="50" class="t-cap">日子（倒数/正数）+ 待办 · 底部大滑块 · 纪念合并回计划</text>

  <!-- ================= 1 · 日子态 ================= -->
  <rect x="36" y="72" width="210" height="560" rx="20" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>

  <!-- header -->
  <g>
    <path d="M56 100 L48 106 L56 112" fill="none" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="110" class="t-h">计划</text>
  </g>

  <!-- hero -->
  <rect x="52" y="128" width="178" height="92" rx="14" fill="#F7E8D4"/>
  <text x="141" y="168" class="t-big" text-anchor="middle">12</text>
  <text x="141" y="186" class="t-n" text-anchor="middle">天后</text>
  <text x="141" y="204" class="t-ttl" text-anchor="middle">毕业答辩</text>
  <!-- meta row -->
  <text x="68" y="214" class="t-meta">5/20 · 待办 3/8</text>

  <!-- 今天要做 -->
  <text x="52" y="248" class="t-sec">今天要做</text>
  <g>
    <circle cx="60" cy="268" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="72" y="272" class="t-body">PPT 改完</text>
  </g>
  <g>
    <circle cx="60" cy="290" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="72" y="294" class="t-body">约预答辩</text>
  </g>

  <!-- 日子列表 -->
  <text x="52" y="328" class="t-sec">日子</text>

  <g>
    <text x="52" y="352" class="t-meta" fill="#D4843A">还有 34 天</text>
    <text x="230" y="352" class="t-body" text-anchor="end">去杭州</text>
    <rect x="216" y="344" width="6" height="6" rx="1.5" fill="#D4843A" fill-opacity="0.55"/>
  </g>
  <g>
    <text x="52" y="378" class="t-meta" fill="#D4843A">还有 58 天</text>
    <text x="230" y="378" class="t-body" text-anchor="end">妈妈生日</text>
    <rect x="216" y="370" width="6" height="6" rx="1.5" fill="#7A9B6E" fill-opacity="0.55"/>
  </g>

  <!-- divider 往昔 -->
  <line x1="52" y1="400" x2="230" y2="400" stroke="#E8DDD0" stroke-dasharray="3 3"/>
  <text x="141" y="416" class="t-n" text-anchor="middle" font-size="8.5">过去</text>

  <g>
    <text x="52" y="444" class="t-meta">128 天前</text>
    <text x="230" y="444" class="t-body" text-anchor="end">搬到杭州</text>
  </g>
  <g>
    <text x="52" y="470" class="t-meta">365 天前</text>
    <text x="230" y="470" class="t-body" text-anchor="end">答辩通过</text>
  </g>

  <!-- bottom slider -->
  <rect x="70" y="580" width="142" height="34" rx="17" fill="#F3EBE0" stroke="#E8DDD0" stroke-width="1"/>
  <rect x="73" y="583" width="68" height="28" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="107" y="601" class="t-acc" text-anchor="middle">日子</text>
  <text x="175" y="601" class="t-n" text-anchor="middle">待办</text>

  <text x="141" y="650" class="t-cap" text-anchor="middle">1 · 日子态（默认）</text>

  <!-- ================= 2 · 待办态 ================= -->
  <rect x="270" y="72" width="210" height="560" rx="20" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>

  <g>
    <path d="M290 100 L282 106 L290 112" fill="none" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="110" class="t-h">计划</text>
  </g>

  <!-- 今天 -->
  <text x="286" y="148" class="t-sec">今天 · 2</text>
  <g>
    <circle cx="294" cy="170" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="174" class="t-body">PPT 改完</text>
    <text x="464" y="174" class="t-date" text-anchor="end">毕业答辩</text>
  </g>
  <g>
    <circle cx="294" cy="194" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="198" class="t-body">约预答辩</text>
    <text x="464" y="198" class="t-date" text-anchor="end">毕业答辩</text>
  </g>

  <!-- 本周 -->
  <text x="286" y="236" class="t-sec">本周</text>
  <g>
    <circle cx="294" cy="258" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="262" class="t-body">订酒店</text>
    <text x="464" y="262" class="t-date" text-anchor="end">去杭州</text>
  </g>
  <g>
    <circle cx="294" cy="282" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="286" class="t-body">改签高铁</text>
    <text x="464" y="286" class="t-date" text-anchor="end">去杭州</text>
  </g>

  <!-- 以后 -->
  <text x="286" y="324" class="t-sec">以后</text>
  <g>
    <circle cx="294" cy="346" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="350" class="t-body">买生日礼物</text>
    <text x="464" y="350" class="t-date" text-anchor="end">妈妈生日</text>
  </g>
  <g>
    <circle cx="294" cy="370" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="306" y="374" class="t-body">整理行李清单</text>
    <text x="464" y="374" class="t-date" text-anchor="end">去杭州</text>
  </g>

  <!-- 已完成折叠 -->
  <rect x="286" y="408" width="178" height="36" rx="10" fill="#F3EBE0"/>
  <text x="300" y="430" class="t-n">✓ 已完成 5</text>
  <path d="M446 422 L450 426 L454 422" fill="none" stroke="#B8A992" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom slider -->
  <rect x="304" y="580" width="142" height="34" rx="17" fill="#F3EBE0" stroke="#E8DDD0" stroke-width="1"/>
  <rect x="375" y="583" width="68" height="28" rx="14" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="341" y="601" class="t-n" text-anchor="middle">日子</text>
  <text x="409" y="601" class="t-acc" text-anchor="middle">待办</text>

  <text x="375" y="650" class="t-cap" text-anchor="middle">2 · 待办态</text>

  <!-- ================= 3 · 详情态 ================= -->
  <rect x="504" y="72" width="210" height="560" rx="20" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>

  <g>
    <!-- floating white back -->
    <circle cx="530" cy="106" r="15" fill="#FFFFFF" stroke="#E8DDD0" stroke-width="1" filter="url(#soft)"/>
    <path d="M533 100 L527 106 L533 112" fill="none" stroke="#4A4034" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="554" y="110" class="t-h">毕业答辩</text>
  </g>

  <!-- big countdown -->
  <text x="609" y="168" class="t-big" text-anchor="middle">还有 12 天</text>
  <text x="609" y="188" class="t-meta" text-anchor="middle">5月20 · 从 3/1 起</text>

  <!-- progress dots -->
  <g>
    <circle cx="560" cy="214" r="4" fill="#D4843A"/>
    <circle cx="574" cy="214" r="4" fill="#D4843A"/>
    <circle cx="588" cy="214" r="4" fill="#D4843A"/>
    <circle cx="602" cy="214" r="4" fill="#E8DDD0"/>
    <circle cx="616" cy="214" r="4" fill="#E8DDD0"/>
    <circle cx="630" cy="214" r="4" fill="#E8DDD0"/>
    <circle cx="644" cy="214" r="4" fill="#E8DDD0"/>
    <circle cx="658" cy="214" r="4" fill="#E8DDD0"/>
    <text x="609" y="236" class="t-meta" text-anchor="middle">3 / 8 已完成</text>
  </g>

  <!-- 要做的事 -->
  <text x="520" y="272" class="t-sec">要做的事</text>
  <g>
    <circle cx="528" cy="294" r="5" fill="none" stroke="#D4843A" stroke-width="1.3"/>
    <circle cx="528" cy="294" r="2.2" fill="#D4843A"/>
    <text x="540" y="298" class="t-body" fill="#B8A992" text-decoration="line-through">终稿交给导师</text>
  </g>
  <g>
    <circle cx="528" cy="318" r="5" fill="none" stroke="#D4843A" stroke-width="1.3"/>
    <circle cx="528" cy="318" r="2.2" fill="#D4843A"/>
    <text x="540" y="322" class="t-body" fill="#B8A992" text-decoration="line-through">订酒店</text>
  </g>
  <g>
    <circle cx="528" cy="342" r="5" fill="none" stroke="#D4843A" stroke-width="1.3"/>
    <circle cx="528" cy="342" r="2.2" fill="#D4843A"/>
    <text x="540" y="346" class="t-body" fill="#B8A992" text-decoration="line-through">打印成绩单</text>
  </g>
  <g>
    <circle cx="528" cy="366" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="540" y="370" class="t-body">PPT 改完</text>
  </g>
  <g>
    <circle cx="528" cy="390" r="5" fill="none" stroke="#B8A992" stroke-width="1.2"/>
    <text x="540" y="394" class="t-body">约预答辩</text>
  </g>

  <!-- 一句话打算 -->
  <rect x="520" y="424" width="178" height="44" rx="10" fill="#F3EBE0"/>
  <text x="532" y="444" class="t-n">一句话打算</text>
  <text x="532" y="460" class="t-body">稳住节奏，别熬夜。</text>

  <!-- 关联随记 -->
  <text x="520" y="500" class="t-sec">关联随记</text>
  <g>
    <rect x="520" y="512" width="178" height="32" rx="8" fill="#FFFFFF" stroke="#E8DDD0" stroke-width="1"/>
    <text x="532" y="532" class="t-body">「答辩问答准备」</text>
    <text x="686" y="532" class="t-date" text-anchor="end">256 字</text>
  </g>

  <text x="609" y="650" class="t-cap" text-anchor="middle">3 · 日子详情</text>
</svg>
