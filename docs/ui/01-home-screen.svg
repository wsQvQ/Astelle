<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#9C8B74" stroke-width="1"/>
    </marker>
    <style>
      .t-title { font-size: 14px; font-weight: 500; fill: #2C2418; }
      .t-body { font-size: 12px; fill: #4A4034; }
      .t-cap { font-size: 11px; fill: #9C8B74; }
      .t-zone { font-size: 11px; font-weight: 500; fill: #D4843A; }
      .t-mono { font-size: 10px; fill: #B8A992; font-family: 'SF Mono', Menlo, monospace; }
    </style>
  </defs>

  <text x="36" y="32" class="t-title">首屏 = 编辑器，侧边栏 = 抽屉（2/3 屏滑出）</text>
  <text x="36" y="52" class="t-cap">左：冷启动 · 立刻可写　　右：点侧栏按钮后 · 抽屉滑出，点笔记即关</text>

  <!-- ================= PHONE A : EDITOR (cold start) ================= -->
  <text x="120" y="88" class="t-zone" text-anchor="middle">A · 冷启动（默认）</text>
  <rect x="30" y="100" width="260" height="520" rx="24" fill="#FAF5EF" stroke="#2C2418" stroke-width="1.2"/>
  <rect x="30" y="100" width="260" height="520" rx="24" fill="none" stroke="#E8DDD0" stroke-width="0.5"/>
  <rect x="130" y="112" width="60" height="14" rx="7" fill="#2C2418" opacity="0.12"/>

  <!-- editor top bar -->
  <rect x="31" y="126" width="258" height="48" fill="#FAF5EF"/>
  <line x1="31" y1="174" x2="289" y2="174" stroke="#E8DDD0" stroke-width="1"/>

  <!-- sidebar toggle (the panel icon) -->
  <rect x="42" y="134" width="32" height="32" rx="10" fill="#F3EBE0"/>
  <rect x="51" y="143" width="14" height="14" rx="2" fill="none" stroke="#4A4034" stroke-width="1.5"/>
  <line x1="56.5" y1="143" x2="56.5" y2="157" stroke="#4A4034" stroke-width="1.5"/>

  <text x="160" y="155" font-size="13" fill="#4A4034" font-weight="500" text-anchor="middle">无标题</text>

  <!-- more button -->
  <rect x="246" y="134" width="32" height="32" rx="10" fill="#F3EBE0"/>
  <circle cx="256" cy="150" r="1.5" fill="#9C8B74"/>
  <circle cx="262" cy="150" r="1.5" fill="#9C8B74"/>
  <circle cx="268" cy="150" r="1.5" fill="#9C8B74"/>

  <!-- body -->
  <text x="52" y="210" font-size="13" fill="#B8A992">写下你的想法…</text>
  <text x="52" y="232" font-size="10" fill="#B8A992" opacity="0.75">支持 Markdown · 一开写即消失</text>

  <!-- typing caret hint -->
  <rect x="52" y="248" width="1.5" height="16" fill="#D4843A"/>

  <!-- annotations -->
  <text x="40" y="650" class="t-zone">→ 点左侧栏按钮</text>
  <text x="40" y="666" class="t-cap">抽屉滑出 · 2/3 屏</text>
  <line x1="175" y1="640" x2="175" y2="628" stroke="#9C8B74" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- callout on sidebar button -->
  <line x1="42" y1="150" x2="18" y2="150" stroke="#D4843A" stroke-width="1"/>
  <text x="36" y="112" class="t-zone" transform="rotate(0)">侧栏按钮</text>

  <!-- ================= PHONE B : DRAWER OPEN ================= -->
  <text x="500" y="88" class="t-zone" text-anchor="middle">B · 侧边栏展开</text>
  <rect x="370" y="100" width="260" height="520" rx="24" fill="#FAF5EF" stroke="#2C2418" stroke-width="1.2"/>

  <!-- right 1/3: editor peek + scrim -->
  <rect x="370" y="100" width="260" height="520" rx="24" fill="#FAF5EF"/>
  <!-- editor ghost content behind -->
  <rect x="543" y="100" width="87" height="520" fill="#FAF5EF"/>
  <line x1="543" y1="174" x2="630" y2="174" stroke="#E8DDD0" stroke-width="1"/>
  <text x="555" y="210" font-size="10" fill="#B8A992">写下</text>
  <!-- scrim -->
  <rect x="543" y="100" width="87" height="520" fill="#2C2418" opacity="0.12"/>

  <!-- drawer: 2/3 width -->
  <rect x="370" y="100" width="173" height="520" rx="24" fill="#F3EBE0"/>
  <rect x="530" y="100" width="13" height="520" fill="#F3EBE0"/>
  <!-- drawer right edge shadow -->
  <rect x="543" y="100" width="10" height="520" fill="#2C2418" opacity="0.08"/>

  <!-- B search -->
  <rect x="382" y="124" width="149" height="32" rx="10" fill="#FAF5EF" stroke="#E8DDD0" stroke-width="1"/>
  <circle cx="398" cy="138" r="4.5" fill="none" stroke="#B8A992" stroke-width="1.3"/>
  <line x1="401.5" y1="141.5" x2="405" y2="145" stroke="#B8A992" stroke-width="1.3"/>
  <text x="412" y="143" font-size="10" fill="#B8A992">搜索笔记…</text>

  <!-- C new note -->
  <rect x="382" y="166" width="149" height="34" rx="10" fill="#F7E8D4"/>
  <line x1="402" y1="176" x2="402" y2="190" stroke="#D4843A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="395" y1="183" x2="409" y2="183" stroke="#D4843A" stroke-width="1.8" stroke-linecap="round"/>
  <text x="418" y="188" font-size="11" fill="#D4843A" font-weight="500">新建笔记</text>

  <!-- import -->
  <rect x="382" y="206" width="149" height="30" rx="10" fill="none" stroke="#E8DDD0" stroke-width="1"/>
  <text x="430" y="225" font-size="10" fill="#9C8B74">导入 Markdown</text>
  <line x1="412" y1="214" x2="412" y2="226" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M407 221 L412 227 L417 221" fill="none" stroke="#9C8B74" stroke-width="1.3" stroke-linecap="round"/>

  <!-- D count row -->
  <text x="384" y="258" class="t-mono">12 篇笔记</text>
  <line x1="512" y1="250" x2="512" y2="262" stroke="#B8A992" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="506" y1="256" x2="518" y2="256" stroke="#B8A992" stroke-width="1.5" stroke-linecap="round"/>

  <!-- E cards -->
  <!-- selected card -->
  <rect x="378" y="274" width="157" height="64" rx="12" fill="#F7E8D4"/>
  <rect x="378" y="294" width="3" height="18" rx="1.5" fill="#D4843A" opacity="0.6"/>
  <text x="390" y="296" font-size="11" fill="#D4843A" font-weight="500">读书摘抄</text>
  <text x="524" y="296" class="t-mono" text-anchor="end" font-size="9">04-02</text>
  <text x="390" y="314" font-size="9" fill="#9C8B74">「我深怕自己本非美玉…</text>
  <text x="390" y="330" class="t-mono" font-size="9">09:15 · 256 字</text>

  <!-- card 2 -->
  <rect x="378" y="346" width="157" height="58" rx="12" fill="#FFFFFF" opacity="0.5"/>
  <text x="390" y="368" font-size="11" fill="#4A4034" font-weight="500">买菜清单</text>
  <text x="524" y="368" class="t-mono" text-anchor="end" font-size="9">04-02</text>
  <text x="390" y="386" font-size="9" fill="#B8A992">西红柿、鸡蛋、葱…</text>
  <text x="390" y="398" class="t-mono" font-size="9">14:32 · 48 字</text>

  <!-- category collapsed -->
  <rect x="378" y="414" width="157" height="28" rx="10" fill="none" stroke="#D4843A" stroke-opacity="0.15" stroke-width="1"/>
  <text x="388" y="432" font-size="11" fill="#4A4034">📁 工作</text>
  <text x="510" y="432" class="t-mono" font-size="9">5</text>
  <path d="M522 426 L528 431 L522 436" fill="none" stroke="#B8A992" stroke-width="1.2" stroke-linecap="round"/>

  <!-- category expanded -->
  <rect x="378" y="450" width="157" height="28" rx="10" fill="#D4843A" fill-opacity="0.08" stroke="#D4843A" stroke-opacity="0.15" stroke-width="1"/>
  <text x="388" y="468" font-size="11" fill="#4A4034">📁 灵感</text>
  <text x="510" y="468" class="t-mono" font-size="9">3</text>
  <line x1="524" y1="458" x2="524" y2="472" stroke="#B8A992" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="517" y1="465" x2="531" y2="465" stroke="#B8A992" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="378" y="478" width="157" height="56" fill="#D4843A" fill-opacity="0.03"/>
  <rect x="378" y="478" width="157" height="56" fill="none" stroke="#D4843A" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="384" y="486" width="145" height="44" rx="10" fill="#FFFFFF" opacity="0.55"/>
  <text x="394" y="506" font-size="11" fill="#4A4034" font-weight="500">雨天窗边的句子</text>
  <text x="520" y="506" class="t-mono" text-anchor="end" font-size="9">03-30</text>
  <text x="394" y="522" font-size="9" fill="#B8A992">把耳机里的歌词抄下来…</text>

  <!-- annotations for B -->
  <text x="370" y="650" class="t-cap">抽屉宽 = 屏 × 2/3（约 240dp）</text>
  <text x="370" y="666" class="t-cap">右 1/3：编辑器 + 蒙层，点按即关</text>

  <!-- flow arrow A -> B -->
  <line x1="300" y1="360" x2="360" y2="360" stroke="#D4843A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="330" y="350" class="t-zone" text-anchor="middle">点 ≡</text>

  <!-- flow arrow B -> A -->
  <line x1="360" y1="390" x2="300" y2="390" stroke="#9C8B74" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="330" y="412" class="t-cap" text-anchor="middle">点笔记/遮罩</text>

  <!-- footer -->
  <text x="36" y="690" class="t-cap">抽屉无顶栏小按钮；搜索框即入口。卡片/分类规格沿用花笺层级，色相用 Astelle 暖橙。</text>
</svg>
